<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <title>AboveDeck — Cloud Inversion Forecast</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            viridis: {
              900: '#440154',
              800: '#482878',
              700: '#3e4989',
              600: '#31688e',
              500: '#26828e',
              400: '#1f9e89',
              300: '#35b779',
              200: '#6ece58',
              100: '#b5de2b',
              50: '#fde725',
            },
          },
        },
      },
    };
  </script>
  <style>
    #map { min-height: 320px; }
    @media (min-width: 1024px) {
      #map { height: 100%; min-height: 0; }
    }
    .maplibregl-popup-content {
      border-radius: 0.75rem;
      padding: 0.75rem 0.9rem;
      font-size: 0.8125rem;
      box-shadow: 0 8px 24px rgba(68, 1, 84, 0.18);
      min-width: 11.5rem;
    }
    .rank-card { transition: box-shadow 0.15s, border-color 0.15s; cursor: pointer; }
    .rank-card:hover, .rank-card.active {
      border-color: #26828e;
      box-shadow: 0 0 0 1px #26828e33;
    }
    @keyframes skeleton-shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .skeleton-block {
      background: linear-gradient(90deg, #e8ece9 0%, #f4f6f5 40%, #e8ece9 80%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-[#f3f6f4] text-slate-800">
  <header class="sticky top-0 z-30 border-b border-viridis-600/15 bg-white/95 backdrop-blur">
    <div class="flex items-center gap-4 px-5 py-3 lg:px-6">
      <div class="flex items-center gap-2.5 font-bold text-viridis-900">
        <img src="assets/favicon.png" alt="" class="h-8 w-8 rounded-lg shadow-sm" width="32" height="32" />
        AboveDeck
      </div>
      <div class="ml-2 flex flex-1 items-center gap-2 rounded-xl border border-viridis-600/15 bg-viridis-900/[0.03] px-3 py-2 sm:max-w-md">
        <svg class="h-4 w-4 text-viridis-600/60" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
        <input id="search-input" placeholder="Search peaks…" class="w-full bg-transparent text-sm outline-none placeholder:text-slate-400" />
      </div>
      <a href="templates/about.html" class="ml-auto hidden rounded-lg border border-viridis-600/20 px-3 py-1.5 text-sm font-medium text-viridis-700 hover:bg-viridis-900/5 sm:block">About</a>
    </div>
  </header>

  <main class="flex flex-col lg:flex-row lg:h-[calc(100vh-3.5rem)]">
    <!-- LEFT: text + ranked list -->
    <section class="flex min-h-0 flex-col lg:w-[44%] xl:w-[40%] lg:border-r lg:border-viridis-600/10">
      <div class="shrink-0 px-5 py-5 lg:px-6">
        <h1 class="text-2xl font-bold tracking-tight text-viridis-900 sm:text-3xl">Where to get above the clouds</h1>
        <p class="mt-1 text-sm text-slate-500">Oregon &amp; Washington · ranked by above-cloud probability</p>
        <p id="best-pick" class="mt-2 text-sm font-medium text-viridis-800">Scanning peaks in view…</p>
        <div id="day-pills" class="mt-4 flex flex-wrap items-center gap-2">
          <button type="button" data-day-offset="0" class="day-pill rounded-full bg-viridis-600 px-4 py-1.5 text-sm font-medium text-white shadow-sm">Today</button>
          <button type="button" data-day-offset="1" class="day-pill rounded-full border border-viridis-600/15 bg-white px-4 py-1.5 text-sm text-slate-600 hover:bg-viridis-900/5">+1</button>
          <button type="button" data-day-offset="2" class="day-pill rounded-full border border-viridis-600/15 bg-white px-4 py-1.5 text-sm text-slate-600 hover:bg-viridis-900/5">+2</button>
          <button type="button" data-day-offset="3" class="day-pill rounded-full border border-viridis-600/15 bg-white px-4 py-1.5 text-sm text-slate-600 hover:bg-viridis-900/5">+3</button>
          <button type="button" id="refresh-area" class="ml-auto rounded-full border border-viridis-600/25 bg-white px-4 py-1.5 text-sm font-medium text-viridis-700 hover:bg-viridis-900/5">Refresh this area</button>
        </div>
      </div>

      <div id="peak-list" class="flex-1 space-y-3 overflow-y-auto px-5 pb-6 lg:px-6">
        <p id="peak-list-status" class="rounded-xl border border-viridis-600/10 bg-white px-4 py-3 text-sm text-slate-500">Loading peaks in view…</p>
      </div>

      <footer class="shrink-0 border-t border-viridis-600/10 px-5 py-2.5 lg:px-6">
        <a href="templates/status.html" class="text-xs text-slate-400 hover:text-viridis-700 hover:underline">System status</a>
      </footer>
    </section>

    <!-- RIGHT: map -->
    <section class="relative min-h-[40vh] flex-1 lg:min-h-0">
      <div id="map" class="h-full w-full"></div>
      <div class="pointer-events-none absolute bottom-3 left-3 flex flex-col gap-2 sm:flex-row sm:items-end">
        <div class="pointer-events-auto rounded-xl bg-white/95 px-3 py-2 text-xs shadow backdrop-blur">
          <p class="mb-1.5 font-semibold uppercase tracking-wide text-viridis-800">Wilderness areas</p>
          <div class="flex items-center gap-2"><span class="h-3 w-5 rounded bg-viridis-300/70 ring-1 ring-viridis-500"></span> NWPS boundaries</div>
        </div>
        <div class="pointer-events-auto rounded-xl bg-white/95 px-3 py-2 text-xs shadow backdrop-blur">
          <p class="mb-1.5 font-semibold uppercase tracking-wide text-viridis-800">Above-cloud chance</p>
          <div class="flex flex-wrap gap-x-3 gap-y-1">
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-full bg-viridis-50"></span>Excellent</span>
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-full bg-viridis-300"></span>Strong</span>
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-full bg-viridis-600"></span>Possible</span>
            <span class="flex items-center gap-1"><span class="h-2.5 w-2.5 rounded-full bg-viridis-900"></span>None</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const VIRIDIS = ['#440154', '#482878', '#3e4989', '#31688e', '#26828e', '#1f9e89', '#35b779', '#6ece58', '#b5de2b', '#fde725'];
    const PEAK_DOT_COLOR = '#26828e';
    const apiBaseUrl = (window.ABOVEDECK_CONFIG && window.ABOVEDECK_CONFIG.apiBaseUrl) || 'http://localhost:8000';
    const PEAKS_FETCH_CAP = 200;

    let selectedDayOffset = 0;
    let peaksInView = [];
    let lastFetchKey = '';
    let peakPopup = null;
    let moveendTimer = null;
    let suppressMoveFetch = false;
    let selectedPeakId = null;
    let pulseTimer = null;
    let pulsePhase = 0;
    let bestPeakIdInView = null;

    function probToColor(pct) {
      const t = Math.max(0, Math.min(100, pct)) / 100;
      const idx = Math.round(t * (VIRIDIS.length - 1));
      return VIRIDIS[idx];
    }

    function strengthLabel(strength) {
      const labels = { excellent: 'Excellent', strong: 'Strong', possible: 'Possible', none: 'None' };
      return labels[strength] || 'Unknown';
    }

    function formatElevationFt(elevationM) {
      if (!elevationM) return 'Elevation unknown';
      return `${Math.round(elevationM * 3.28084).toLocaleString()} ft`;
    }

    function selectedDateIso() {
      const date = new Date();
      date.setDate(date.getDate() + selectedDayOffset);
      return date.toISOString().slice(0, 10);
    }

    function dayPillLabel(offset) {
      if (offset === 0) return 'Today';
      const date = new Date();
      date.setDate(date.getDate() + offset);
      return date.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
    }

    function updateDayPills() {
      document.querySelectorAll('.day-pill').forEach((button) => {
        const offset = Number(button.dataset.dayOffset);
        const active = offset === selectedDayOffset;
        button.textContent = dayPillLabel(offset);
        button.className = active
          ? 'day-pill rounded-full bg-viridis-600 px-4 py-1.5 text-sm font-medium text-white shadow-sm'
          : 'day-pill rounded-full border border-viridis-600/15 bg-white px-4 py-1.5 text-sm text-slate-600 hover:bg-viridis-900/5';
      });
    }

    function updateBestPick(peaks) {
      const el = document.getElementById('best-pick');
      if (!el) return;
      if (!peaks.length) {
        bestPeakIdInView = null;
        el.textContent = 'Pan the map to find peaks above the cloud deck.';
        return;
      }
      const best = peaks[0];
      bestPeakIdInView = best.id;
      const pct = Math.round((best.above_cloud_prob || 0) * 100);
      if (pct <= 0) {
        el.textContent = `Highest in view: ${best.name} · ${formatElevationFt(best.elevation_m)}`;
        return;
      }
      el.textContent = `Best in view: ${best.name} · ${pct}% · ${strengthLabel(best.inversion_strength)}`;
    }

    function currentBboxKey() {
      const bounds = map.getBounds();
      const bbox = [
        bounds.getWest().toFixed(4),
        bounds.getSouth().toFixed(4),
        bounds.getEast().toFixed(4),
        bounds.getNorth().toFixed(4),
      ].join(',');
      return `${bbox}|${selectedDateIso()}`;
    }

    function sortPeaksForList(peaks) {
      const hasAnyElevation = peaks.some((peak) => peak.elevation_m);
      const hasUsefulProb = peaks.some((peak) => (peak.above_cloud_prob || 0) > 0);
      return [...peaks].sort((a, b) => {
        if (hasUsefulProb) {
          const probDiff = (b.above_cloud_prob || 0) - (a.above_cloud_prob || 0);
          if (probDiff !== 0) return probDiff;
        }
        if (hasAnyElevation) {
          const elevDiff = (b.elevation_m || 0) - (a.elevation_m || 0);
          if (elevDiff !== 0) return elevDiff;
        }
        return (a.name || '').localeCompare(b.name || '');
      });
    }

    function peaksToGeoJSON(peaks) {
      return {
        type: 'FeatureCollection',
        features: peaks.map((peak) => ({
          type: 'Feature',
          geometry: {
            type: 'Point',
            coordinates: [peak.lon, peak.lat],
          },
          properties: {
            id: peak.id,
            name: peak.name,
            state: peak.state,
            elevation_m: peak.elevation_m || 0,
            above_cloud_prob: peak.above_cloud_prob || 0,
            inversion_strength: peak.inversion_strength || 'none',
            confidence: peak.confidence || 'low',
          },
        })),
      };
    }

    function setPeaksOnMap(peaks) {
      const source = map.getSource('peaks');
      if (source) source.setData(peaksToGeoJSON(peaks));
    }

    function clearSelectedPeak() {
      selectedPeakId = null;
      stopPulse();
      const source = map.getSource('selected-peak');
      if (source) source.setData({ type: 'FeatureCollection', features: [] });
    }

    function clearPeaksOnMap() {
      setPeaksOnMap([]);
      clearSelectedPeak();
      if (peakPopup) {
        peakPopup.remove();
        peakPopup = null;
      }
    }

    function stopPulse() {
      if (pulseTimer) {
        clearInterval(pulseTimer);
        pulseTimer = null;
      }
      pulsePhase = 0;
    }

    function startPulse() {
      stopPulse();
      if (!map.getLayer('selected-peak-halo')) return;
      pulseTimer = setInterval(() => {
        if (!map.getLayer('selected-peak-halo')) return;
        pulsePhase += 0.1;
        const t = (Math.sin(pulsePhase) + 1) / 2;
        map.setPaintProperty('selected-peak-halo', 'circle-radius', 14 + t * 12);
        map.setPaintProperty('selected-peak-halo', 'circle-opacity', 0.18 + t * 0.28);
      }, 50);
    }

    function setSelectedPeak(peak) {
      if (!peak || peak.lat == null || peak.lon == null || (peak.lat === 0 && peak.lon === 0)) {
        clearSelectedPeak();
        return;
      }
      selectedPeakId = peak.id;
      const source = map.getSource('selected-peak');
      if (!source) return;
      source.setData({
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [peak.lon, peak.lat] },
          properties: { id: peak.id },
        }],
      });
      startPulse();
    }

    function showLoadingSkeleton(message) {
      const list = document.getElementById('peak-list');
      const best = document.getElementById('best-pick');
      if (best) best.textContent = 'Scanning peaks in view…';
      list.innerHTML = `
        <p id="peak-list-status" class="rounded-xl border border-viridis-600/10 bg-white px-4 py-3 text-sm text-slate-500">${message}</p>
      `;
    }

    function updatePeakListStatus(message) {
      const status = document.getElementById('peak-list-status');
      if (status) {
        status.textContent = message;
        return;
      }
      const list = document.getElementById('peak-list');
      list.innerHTML = `<p id="peak-list-status" class="rounded-xl border border-viridis-600/10 bg-white px-4 py-3 text-sm text-slate-500">${message}</p>`;
    }

    const HEALTH_TIMEOUT_MS = 90000;
    const PEAKS_TIMEOUT_MS = 45000;
    const REFRESH_TIMEOUT_MS = 120000;
    const WAKE_ATTEMPTS = 3;
    let forecastRefreshInFlight = null;
    let forecastRefreshKey = '';

    function fetchWithTimeout(url, timeoutMs, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
    }

    function apiUnreachableMessage(error) {
      const origin = window.location.origin;
      if (origin === 'file://' || origin.startsWith('file:')) {
        return 'Cannot call the API from a file:// page. Serve the site locally or use GitHub Pages.';
      }
      const aborted = error && (error.name === 'AbortError' || /abort/i.test(String(error.message || '')));
      if (aborted) {
        return 'API is asleep or slow to wake (Render free tier). Wait a minute and click Refresh this area.';
      }
      return `Could not reach the API from ${origin}. If this is a new origin, add it to CORS_ORIGINS on Render.`;
    }

    async function wakeApi() {
      let lastError;
      for (let attempt = 1; attempt <= WAKE_ATTEMPTS; attempt += 1) {
        showLoadingSkeleton(
          attempt === 1
            ? 'Waking API… first request can take up to a minute on Render free tier.'
            : `Waking API… retry ${attempt} of ${WAKE_ATTEMPTS}`,
        );
        try {
          const response = await fetchWithTimeout(`${apiBaseUrl}/health`, HEALTH_TIMEOUT_MS);
          if (response.ok) return;
          lastError = new Error(`health ${response.status}`);
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error('API unreachable');
    }

    function flyToPeak(peak, { showPopup = true } = {}) {
      if (peak.lat == null || peak.lon == null || (peak.lat === 0 && peak.lon === 0)) return;
      document.querySelectorAll('.rank-card').forEach((node) => {
        node.classList.toggle('active', String(node.dataset.peakId) === String(peak.id));
      });
      setSelectedPeak(peak);
      suppressMoveFetch = true;
      map.flyTo({
        center: [peak.lon, peak.lat],
        zoom: Math.max(map.getZoom(), 9),
        duration: 900,
      });
      map.once('moveend', () => { suppressMoveFetch = false; });
      if (showPopup) showPeakPopup(peak);
    }

    function renderPeakList(peaks, { searching = false } = {}) {
      const list = document.getElementById('peak-list');
      list.innerHTML = '';

      if (!searching) updateBestPick(peaks);

      if (!peaks.length) {
        list.innerHTML = `<p class="rounded-xl border border-viridis-600/10 bg-white px-4 py-3 text-sm text-slate-500">${
          searching ? 'No peaks match that search.' : 'No peaks in this view. Zoom in or pan to a mountainous area.'
        }</p>`;
        return;
      }

      const status = document.createElement('p');
      status.id = 'peak-list-status';
      status.className = 'rounded-xl border border-viridis-600/10 bg-white px-4 py-3 text-sm text-slate-500';
      if (searching) {
        status.textContent = `${peaks.length} search result${peaks.length === 1 ? '' : 's'} — click to fly there`;
      } else {
        const capped = peaks.length >= PEAKS_FETCH_CAP;
        status.textContent = capped
          ? `Showing ${peaks.length} peaks in view (capped at ${PEAKS_FETCH_CAP} — zoom in for denser areas)`
          : `Showing ${peaks.length} peaks in view`;
      }
      list.appendChild(status);

      peaks.forEach((peak, index) => {
        const pct = Math.round((peak.above_cloud_prob || 0) * 100);
        const color = pct > 0 ? probToColor(pct) : PEAK_DOT_COLOR;
        const rank = index + 1;
        const isBest = !searching && peak.id === bestPeakIdInView && pct > 0;
        const card = document.createElement('article');
        card.className = `rank-card overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm${selectedPeakId === peak.id ? ' active' : ''}`;
        card.dataset.peakId = String(peak.id);

        card.innerHTML = `
          <div class="flex items-center gap-4 p-4 ${pct < 20 && !searching ? 'opacity-80' : ''}">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl font-bold" style="background:${color}22;color:${color}">${searching ? '◎' : rank}</span>
            <div class="flex-1 min-w-0">
              <h3 class="font-semibold text-viridis-900 truncate">${peak.name}</h3>
              <p class="text-xs text-slate-500">${peak.state} · ${formatElevationFt(peak.elevation_m)}${searching ? '' : ` · ${strengthLabel(peak.inversion_strength)}`}${isBest ? ' · Best in view' : ''}</p>
            </div>
            <div class="text-right shrink-0">${searching
              ? '<p class="text-xs font-medium text-viridis-700">Fly to</p>'
              : `<p class="text-2xl font-bold" style="color:${color}">${pct}%</p>`}</div>
          </div>`;

        card.addEventListener('mouseenter', () => {
          document.querySelectorAll('.rank-card').forEach((node) => node.classList.remove('active'));
          card.classList.add('active');
        });
        card.addEventListener('click', () => {
          flyToPeak({ ...peak, isBest });
        });
        list.appendChild(card);
      });
    }

    function showPeakPopup(peak) {
      const pct = Math.round((peak.above_cloud_prob || 0) * 100);
      const color = pct > 0 ? probToColor(pct) : PEAK_DOT_COLOR;
      const strength = strengthLabel(peak.inversion_strength);
      const confidence = peak.confidence || 'low';
      const isBest = peak.isBest || (peak.id != null && peak.id === bestPeakIdInView && pct > 0);
      if (peakPopup) peakPopup.remove();
      peakPopup = new maplibregl.Popup({ offset: 14, closeButton: true })
        .setLngLat([peak.lon, peak.lat])
        .setHTML(
          `<div style="line-height:1.35">` +
          (isBest ? `<div style="margin-bottom:0.35rem;font-size:0.7rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#31688e">Best in view today</div>` : '') +
          `<strong style="font-size:0.95rem;color:#440154">${peak.name}</strong><br>` +
          `<span style="color:#64748b">${peak.state} · ${formatElevationFt(peak.elevation_m)}</span><br>` +
          `<span style="display:inline-block;margin-top:0.35rem;font-weight:700;color:${color}">${pct}% above cloud</span><br>` +
          `<span style="color:#475569">${strength} · Confidence: ${confidence}</span>` +
          `</div>`
        )
        .addTo(map);
    }

    function ensurePeaksLayers() {
      if (!map.getSource('peaks')) {
        map.addSource('peaks', {
          type: 'geojson',
          data: peaksToGeoJSON([]),
        });
      }

      if (!map.getSource('selected-peak')) {
        map.addSource('selected-peak', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
      }

      if (!map.getLayer('selected-peak-halo')) {
        map.addLayer({
          id: 'selected-peak-halo',
          type: 'circle',
          source: 'selected-peak',
          paint: {
            'circle-radius': 18,
            'circle-color': '#fde725',
            'circle-opacity': 0.35,
            'circle-stroke-width': 0,
          },
        });
      }

      if (!map.getLayer('peaks-dots')) {
        map.addLayer({
          id: 'peaks-dots',
          type: 'circle',
          source: 'peaks',
          paint: {
            'circle-radius': [
              'interpolate', ['linear'], ['zoom'],
              5, 2.5,
              8, 4,
              11, 6,
            ],
            'circle-color': [
              'interpolate', ['linear'], ['get', 'above_cloud_prob'],
              0, '#440154',
              0.25, '#31688e',
              0.5, '#35b779',
              0.75, '#b5de2b',
              1, '#fde725',
            ],
            'circle-opacity': 0.9,
            'circle-stroke-width': 1,
            'circle-stroke-color': '#ffffff',
          },
        });
      }

      if (!map.getLayer('selected-peak-core')) {
        map.addLayer({
          id: 'selected-peak-core',
          type: 'circle',
          source: 'selected-peak',
          paint: {
            'circle-radius': [
              'interpolate', ['linear'], ['zoom'],
              5, 5,
              8, 7,
              11, 9,
            ],
            'circle-color': '#fde725',
            'circle-stroke-width': 2,
            'circle-stroke-color': '#440154',
          },
        });
      }

      if (!map.getLayer('peaks-labels')) {
        map.addLayer({
          id: 'peaks-labels',
          type: 'symbol',
          source: 'peaks',
          minzoom: 7,
          layout: {
            'text-field': ['get', 'name'],
            'text-size': [
              'interpolate', ['linear'], ['zoom'],
              7, 10,
              10, 13,
            ],
            'text-font': ['Open Sans Regular', 'Arial Unicode MS Regular'],
            'text-offset': [0, 1.1],
            'text-anchor': 'top',
            'text-max-width': 8,
            'text-allow-overlap': false,
            'text-ignore-placement': false,
            'text-optional': true,
            'symbol-sort-key': ['-', ['get', 'elevation_m']],
          },
          paint: {
            'text-color': '#440154',
            'text-halo-color': '#ffffff',
            'text-halo-width': 1.4,
          },
        });
      }
    }

    async function refreshForecastsInBackground(bbox, fetchKey) {
      if (forecastRefreshInFlight && forecastRefreshKey === fetchKey) {
        return forecastRefreshInFlight;
      }
      forecastRefreshKey = fetchKey;
      updatePeakListStatus('Peaks loaded — updating forecasts…');
      forecastRefreshInFlight = (async () => {
        try {
          const refreshUrl = `${apiBaseUrl}/predictions/refresh?bbox=${encodeURIComponent(bbox)}&date=${selectedDateIso()}&limit=40`;
          const refreshResponse = await fetchWithTimeout(refreshUrl, REFRESH_TIMEOUT_MS, { method: 'POST' });
          if (!refreshResponse.ok) {
            updatePeakListStatus(
              refreshResponse.status === 502
                ? 'Peaks loaded — weather service is busy. Try Refresh this area in a minute.'
                : `Peaks loaded — forecast refresh failed (${refreshResponse.status}).`
            );
            return;
          }
          if (currentBboxKey() !== fetchKey) return;
          const reload = await fetchWithTimeout(
            `${apiBaseUrl}/peaks?bbox=${encodeURIComponent(bbox)}&date=${selectedDateIso()}`,
            PEAKS_TIMEOUT_MS,
          );
          if (!reload.ok || currentBboxKey() !== fetchKey) return;
          const payload = await reload.json();
          peaksInView = sortPeaksForList(payload.peaks || []);
          renderPeakList(peaksInView);
          setPeaksOnMap(peaksInView);
          if (!payload.forecasts_ready) {
            updatePeakListStatus('Peaks loaded — forecasts still updating. Try Refresh this area shortly.');
          }
        } catch (error) {
          if (currentBboxKey() === fetchKey) {
            updatePeakListStatus('Peaks loaded — forecast update timed out. Try Refresh this area.');
          }
        } finally {
          if (forecastRefreshKey === fetchKey) {
            forecastRefreshInFlight = null;
          }
        }
      })();
      return forecastRefreshInFlight;
    }

    async function fetchPeaksInView({ force = false, wake = false } = {}) {
      const fetchKey = currentBboxKey();
      if (!force && fetchKey === lastFetchKey) return;
      lastFetchKey = fetchKey;

      try {
        if (wake) await wakeApi();
        else showLoadingSkeleton('Loading peaks in view…');

        const bounds = map.getBounds();
        const bbox = [
          bounds.getWest(),
          bounds.getSouth(),
          bounds.getEast(),
          bounds.getNorth(),
        ].join(',');
        const url = `${apiBaseUrl}/peaks?bbox=${encodeURIComponent(bbox)}&date=${selectedDateIso()}`;

        const response = await fetchWithTimeout(url, PEAKS_TIMEOUT_MS);
        if (!response.ok) {
          const message = response.status === 503
            ? 'API database not configured yet. Set DATABASE_URL on Render, then refresh.'
            : `Failed to load peaks (${response.status})`;
          updateBestPick([]);
          updatePeakListStatus(message);
          peaksInView = [];
          clearPeaksOnMap();
          return;
        }

        const payload = await response.json();
        peaksInView = sortPeaksForList(payload.peaks || []);
        renderPeakList(peaksInView);
        setPeaksOnMap(peaksInView);

        if (!payload.forecasts_ready) {
          refreshForecastsInBackground(bbox, fetchKey);
        }
      } catch (error) {
        lastFetchKey = '';
        updateBestPick([]);
        updatePeakListStatus(apiUnreachableMessage(error));
        peaksInView = [];
        clearPeaksOnMap();
      }
    }

    async function searchPeaks(query) {
      if (!query.trim()) {
        renderPeakList(peaksInView);
        setPeaksOnMap(peaksInView);
        return;
      }
      const response = await fetch(`${apiBaseUrl}/peaks/search?q=${encodeURIComponent(query.trim())}`);
      if (!response.ok) return;
      const payload = await response.json();
      const results = (payload.results || []).map((result) => ({
        id: result.id,
        name: result.name,
        state: result.state,
        elevation_m: result.elevation_m,
        lat: result.lat,
        lon: result.lon,
        above_cloud_prob: 0,
        inversion_strength: 'none',
        confidence: 'low',
      }));
      renderPeakList(results, { searching: true });
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [-120.75, 44.6],
      zoom: 5.6,
      minZoom: 5,
      maxZoom: 12,
      maxBounds: [[-125.5, 41.8], [-116.2, 49.2]],
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

    map.on('load', () => {
      map.resize();
      map.addSource('wilderness', {
        type: 'geojson',
        data: 'data/wilderness-or-wa.geojson',
      });

      map.addLayer({
        id: 'wilderness-fill',
        type: 'fill',
        source: 'wilderness',
        paint: {
          'fill-color': '#35b779',
          'fill-opacity': 0.38,
        },
      });

      map.addLayer({
        id: 'wilderness-outline',
        type: 'line',
        source: 'wilderness',
        paint: {
          'line-color': '#26828e',
          'line-width': 1.2,
          'line-opacity': 0.85,
        },
      });

      map.addLayer({
        id: 'wilderness-labels',
        type: 'symbol',
        source: 'wilderness',
        minzoom: 7,
        layout: {
          'text-field': ['get', 'NAME'],
          'text-size': 11,
          'text-font': ['Open Sans Regular', 'Arial Unicode MS Regular'],
          'text-max-width': 8,
        },
        paint: {
          'text-color': '#440154',
          'text-halo-color': '#ffffff',
          'text-halo-width': 1.2,
        },
      });

      ensurePeaksLayers();

      map.on('click', 'peaks-dots', (event) => {
        const feature = event.features && event.features[0];
        if (!feature) return;
        const props = feature.properties;
        const [lon, lat] = feature.geometry.coordinates;
        const peak = {
          id: props.id,
          name: props.name,
          state: props.state,
          elevation_m: Number(props.elevation_m) || 0,
          lon,
          lat,
          above_cloud_prob: Number(props.above_cloud_prob) || 0,
          inversion_strength: props.inversion_strength || 'none',
          confidence: props.confidence || 'low',
          isBest: Number(props.id) === Number(bestPeakIdInView),
        };
        flyToPeak(peak);
      });

      map.on('mouseenter', 'peaks-dots', () => {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'peaks-dots', () => {
        map.getCanvas().style.cursor = '';
      });

      fetchPeaksInView({ force: true, wake: true });
    });

    map.on('moveend', () => {
      if (suppressMoveFetch) return;
      clearTimeout(moveendTimer);
      moveendTimer = setTimeout(() => {
        fetchPeaksInView();
      }, 350);
    });

    document.getElementById('refresh-area').addEventListener('click', async () => {
      lastFetchKey = '';
      forecastRefreshKey = '';
      await fetchPeaksInView({ force: true, wake: true });
      const bounds = map.getBounds();
      const bbox = [
        bounds.getWest(),
        bounds.getSouth(),
        bounds.getEast(),
        bounds.getNorth(),
      ].join(',');
      await refreshForecastsInBackground(bbox, currentBboxKey());
    });

    document.querySelectorAll('.day-pill').forEach((button) => {
      button.addEventListener('click', () => {
        selectedDayOffset = Number(button.dataset.dayOffset);
        updateDayPills();
        fetchPeaksInView({ force: true, wake: true });
      });
    });

    let searchTimer;
    document.getElementById('search-input').addEventListener('input', (event) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => searchPeaks(event.target.value), 250);
    });

    updateDayPills();
    window.addEventListener('resize', () => map.resize());
  </script>
</body>
</html>
