name: Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "https://abovedeck-webservice.onrender.com/health?source=keepalive"
