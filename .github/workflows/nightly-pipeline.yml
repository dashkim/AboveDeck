name: Nightly Pipeline

# Prefill predictions overnight so the map reads from Neon instead of waiting
# on live Open-Meteo (which rate-limits the Render IP).
# Caps peaks for Neon free-tier storage; raise once storage allows.
on:
  workflow_dispatch:
  schedule:
    # ~midnight Pacific: 07:00 UTC (PDT) / still late evening in PST
    - cron: "0 7 * * *"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Highest peaks first — covers the summits users actually browse.
      NIGHTLY_PEAK_LIMIT: "2000"
      NIGHTLY_FORECAST_DAYS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Run migrations
        run: python scripts/run_migrations.py

      - name: Ingest weather forecasts
        run: >
          python ml/pipeline/ingest.py
          --limit ${{ env.NIGHTLY_PEAK_LIMIT }}
          --forecast-days ${{ env.NIGHTLY_FORECAST_DAYS }}
          --reingest-all
          --api-batch-size 40

      - name: Score peaks (rules-v1 cache)
        run: python ml/pipeline/score.py --limit ${{ env.NIGHTLY_PEAK_LIMIT }}

      - name: Prune weather; keep upcoming predictions
        run: python ml/pipeline/prune.py --horizon-days ${{ env.NIGHTLY_FORECAST_DAYS }}
