name: Nightly Pipeline

# Do not run on a schedule until ingest writes to a local DB.
# This job still points at Neon and would refill the 512 MB free-tier cap.
on:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Run migrations
        run: python scripts/run_migrations.py

      - name: Ingest weather forecasts
        run: python ml/pipeline/ingest.py

      - name: Generate labels from METAR
        run: python ml/pipeline/label.py --days 7

      - name: Score peaks
        run: python ml/pipeline/score.py

      - name: Prune old data
        run: python ml/pipeline/prune.py --days 14

  train:
    runs-on: ubuntu-latest
    needs: pipeline
    if: github.event_name == 'schedule' && (github.run_number % 7 == 0)
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Train model
        run: python ml/pipeline/train.py --min-samples 50

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: inversion-model
          path: ml/models/artifacts/
          if-no-files-found: ignore
