name: Nightly Pipeline

# Limited free-tier run: top peaks only, rules scoring, then prune weather.
# Re-enable a cron once Neon storage / paid tier can hold fuller ingest.
on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily (~11pm/10pm PT)
    - cron: "0 6 * * *"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Run migrations
        run: python scripts/run_migrations.py

      - name: Ingest weather forecasts
        # Cap peaks + horizon so Neon free tier stays under storage limits.
        run: python ml/pipeline/ingest.py --limit 600 --forecast-days 3

      - name: Score peaks (rules-v0)
        run: python ml/pipeline/score.py --limit 600

      - name: Prune old data
        run: python ml/pipeline/prune.py --horizon-days 3
